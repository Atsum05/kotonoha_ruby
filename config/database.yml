# PostgreSQL. Uses a local Unix socket by default (no DATABASE_HOST needed),
# so it works out of the box against a locally-installed Postgres with peer
# auth for the current OS user. Override via ENV for anything else.
default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: kotonoha_ruby_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: kotonoha_ruby_test

# The primary production database is PostgreSQL, configured from
# APP_DATABASE_URL (e.g. postgres://user:pass@host:5432/dbname) — deliberately
# NOT named DATABASE_URL. ActiveRecord auto-detects an env var literally named
# DATABASE_URL (or PRIMARY_DATABASE_URL) and force-parses it with its own
# internal `url:` handling, which uses the stricter, older RFC2396 URI grammar
# and raises URI::InvalidURIError on underscores in the host or username —
# and that happens *regardless* of what this file says, so renaming the ENV
# var is the only reliable fix. Managed Postgres providers (Render included)
# commonly auto-generate exactly those kinds of underscored names, so we parse
# APP_DATABASE_URL ourselves with Ruby's lenient default URI parser instead.
#
# The solid_cache/solid_queue/solid_cable side databases stay on SQLite in
# the storage/ directory, which is Rails 8's own recommended pattern for these.
production:
  primary:
    adapter: postgresql
    encoding: unicode
    <% if ENV["APP_DATABASE_URL"] %>
    <% db_url = URI.parse(ENV["APP_DATABASE_URL"]) %>
    host: <%= db_url.host %>
    port: <%= db_url.port %>
    username: <%= URI.decode_www_form_component(db_url.user) %>
    password: <%= URI.decode_www_form_component(db_url.password) %>
    database: <%= db_url.path.delete_prefix("/") %>
    <% end %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
